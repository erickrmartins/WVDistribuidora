<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Galpão Central</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
    <style>
        :root {
            --bg: #F1F3F2;
            --card: #fff;
            --border: rgba(31, 42, 51, .10);
            --main: #1F4E6B;
            --sec: #3B4650;
            --shadow: 0 4px 20px -2px rgba(31, 42, 51, .08);
            --btn: #F2A900;
            --btn-t: #1F2A33;
            --tint: #E1EAEF;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #141A1F;
                --card: #1E272E;
                --border: rgba(255, 255, 255, .09);
                --main: #8FBEDD;
                --sec: #CBD5DC;
                --shadow: none;
                --btn: #F2A900;
                --btn-t: #1F2A33;
                --tint: #2A3742
            }
        }

        :root[data-theme="dark"] {
            --bg: #141A1F;
            --card: #1E272E;
            --border: rgba(255, 255, 255, .09);
            --main: #8FBEDD;
            --sec: #CBD5DC;
            --shadow: none;
            --btn: #F2A900;
            --btn-t: #1F2A33;
            --tint: #2A3742
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: 80px;
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--sec);
            font: 400 17px/1.5 Barlow, system-ui, sans-serif
        }

        h1,
        h2,
        h3,
        p {
            margin: 0
        }

        h1 {
            font: 600 48px/1.1 "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        h2 {
            font-size: 18px;
            font-weight: 400
        }

        a {
            text-decoration: none;
            color: inherit
        }

        :focus-visible {
            outline: 2px solid var(--main);
            outline-offset: 2px
        }

        .hd {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            height: 64px;
            padding: 8px 30px;
            background: var(--bg)
        }

        .hd .logo {
            font: 700 30px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .hd nav {
            display: flex;
            gap: 6px;
            flex: 1;
            justify-content: center
        }

        .hd nav a {
            padding: 5px 22px;
            border-bottom: 2px solid transparent;
            transition: .3s
        }

        .hd nav a:hover {
            color: var(--main);
            border-color: var(--main)
        }

        .btn,
        .hd .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 22px;
            border-radius: 12px;
            border: 0;
            background: var(--btn);
            color: var(--btn-t);
            font: 500 16px Barlow, system-ui, sans-serif;
            cursor: pointer;
            transition: .3s
        }

        .btn:hover {
            filter: brightness(.88)
        }

        .btn.o {
            background: transparent;
            color: var(--main);
            box-shadow: inset 0 0 0 1px var(--main)
        }

        .hd .cta {
            padding: 8px 18px
        }

        section {
            padding: 40px 50px
        }

        .pn {
            background: var(--card);
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow)
        }

        .tt {
            text-align: center;
            max-width: 680px;
            margin: 0 auto 28px
        }

        .tt h2 {
            margin-top: 6px
        }

        .hero {
            min-height: 70vh;
            display: flex;
            align-items: center;
            gap: 30px
        }

        .hero .l {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            align-items: center
        }

        .hero h1 {
            font-size: 64px;
            line-height: 1.05
        }

        .hero .bt {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap
        }

        .hero .r {
            flex: 1;
            display: flex;
            justify-content: center
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 14px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            text-align: center;
            transition: .3s
        }

        .card:hover {
            transform: scale(1.02)
        }

        .card h3 {
            font: 600 26px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .card p {
            font-size: 13px
        }

        .card .pr {
            font-size: 20px;
            color: var(--sec);
            font-weight: 500
        }

        .card .btn {
            width: 100%;
            padding: 8px
        }

        .ph {
            width: 100%;
            aspect-ratio: 4/3;
            border-radius: 10px;
            background: var(--tint);
            display: grid;
            place-items: center;
            border: 1px solid var(--border)
        }

        .ph svg,
        .ic svg {
            width: 44%;
            height: 44%;
            stroke: var(--main);
            fill: none;
            stroke-width: 1.4;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .chips {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 22px
        }

        .chips button {
            border: 0;
            border-radius: 50px;
            padding: 8px 16px;
            background: var(--card);
            color: var(--sec);
            font: 500 14px Barlow, system-ui, sans-serif;
            box-shadow: inset 0 0 0 1px var(--border);
            cursor: pointer
        }

        .chips button[aria-pressed=true] {
            background: var(--btn);
            color: var(--btn-t)
        }

        .dep {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            width: 100%;
            max-width: 960px
        }

        .dep a {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-align: center;
            transition: .3s
        }

        .dep a:hover {
            transform: translateY(-3px);
            border-color: var(--main)
        }

        .dep .ic {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--tint);
            display: grid;
            place-items: center
        }

        .dep b {
            font: 600 26px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .dep span {
            font-size: 13px
        }

        .ben {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 14px;
            max-width: 960px;
            margin: 0 auto
        }

        .ben div {
            background: var(--bg);
            border-radius: 16px;
            padding: 18px;
            text-align: center
        }

        .ben b {
            display: block;
            font: 600 26px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .ben span {
            font-size: 13px
        }

        .row {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px 16px;
            box-shadow: var(--shadow)
        }

        .row .ic {
            width: 56px;
            height: 56px;
            flex: none;
            border-radius: 10px;
            background: var(--tint);
            display: grid;
            place-items: center
        }

        .row .tx {
            flex: 1;
            text-align: left
        }

        .row h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--sec)
        }

        .row p {
            font-size: 13px
        }

        .row .pr {
            font-weight: 600;
            color: var(--main);
            white-space: nowrap
        }

        .row .btn {
            padding: 8px 14px;
            font-size: 14px
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 860px;
            margin: 0 auto
        }

        .list h3.g {
            font: 600 32px "Barlow Condensed", Impact, sans-serif;
            color: var(--main);
            margin: 18px 0 4px;
            text-align: left
        }

        .sob {
            display: flex;
            align-items: center;
            gap: 40px;
            max-width: 960px;
            margin: 0 auto
        }

        .sob .im {
            flex: 1
        }

        .sob .im .ph {
            aspect-ratio: 3/4;
            max-width: 340px;
            margin: auto
        }

        .sob .tx {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: center
        }

        .sob h3 {
            font: 600 36px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .ct {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto
        }

        .ct .bx {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            text-align: center
        }

        .ct label {
            color: var(--main);
            font-size: 20px;
            margin-bottom: 6px
        }

        .ct a {
            padding: 6px 14px;
            border-radius: 50px;
            transition: .2s
        }

        .ct a:hover {
            filter: brightness(.85);
            background: var(--tint)
        }

        .ct .h {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 10px
        }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 30px 20px;
            font-size: 13px;
            text-align: center
        }

        footer a {
            font-weight: 600
        }

        .note {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 50px 0;
            font-size: 13px;
            text-align: center
        }

        @media(max-width:768px) {
            h1 {
                font-size: 40px
            }

            .hero h1 {
                font-size: 44px
            }

            h2 {
                font-size: 14px
            }

            section {
                padding: 30px 20px
            }

            .hd {
                padding: 8px 16px
            }

            .hd nav {
                display: none
            }

            .hero,
            .sob {
                flex-direction: column
            }

            .row {
                flex-wrap: wrap
            }

            .row .btn {
                width: 100%
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important;
                scroll-behavior: auto !important
            }
        }

        [hidden] {
            display: none !important
        }

        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            z-index: 40;
            opacity: 0;
            visibility: hidden;
            transition: .3s
        }

        .ov.on {
            opacity: 1;
            visibility: visible
        }

        #cart {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(420px, 100%);
            z-index: 50;
            background: var(--card);
            display: flex;
            flex-direction: column;
            padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
            transform: translateX(100%);
            visibility: hidden;
            transition: transform .3s, visibility .3s;
            box-shadow: -8px 0 30px rgba(0, 0, 0, .2)
        }

        #cart.on {
            transform: none;
            visibility: visible
        }

        .ch {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border)
        }

        .ch h2 {
            font: 600 30px "Barlow Condensed", Impact, sans-serif;
            color: var(--main)
        }

        .x {
            border: 0;
            background: var(--bg);
            color: var(--sec);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer
        }

        #ci {
            flex: 1;
            overflow-y: auto;
            padding: 12px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .ci {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg);
            border-radius: 14px;
            padding: 10px 12px
        }

        .ci .tx {
            flex: 1
        }

        .ci h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--sec)
        }

        .ci p {
            font-size: 13px
        }

        .st {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .st button,
        .rm {
            border: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--card);
            color: var(--main);
            font-size: 18px;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px var(--border)
        }

        .st span {
            min-width: 18px;
            text-align: center;
            font-weight: 600
        }

        .rm {
            background: transparent;
            box-shadow: none;
            color: var(--sec)
        }

        .em {
            text-align: center;
            padding: 40px 10px
        }

        .cf {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .cf .t {
            display: flex;
            justify-content: space-between;
            font-weight: 600
        }

        .cf .btn:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .cf small {
            font-size: 12px;
            text-align: center
        }

        #clear {
            background: none;
            border: 0;
            color: var(--sec);
            text-decoration: underline;
            cursor: pointer;
            font: inherit;
            font-size: 13px
        }

        .cbtn {
            position: relative;
            flex: none;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 12px;
            background: var(--btn);
            color: var(--btn-t);
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: .3s
        }

        .cbtn:hover {
            filter: brightness(.88)
        }

        .cbtn svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        .cbtn span {
            position: absolute;
            top: -7px;
            right: -7px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background: var(--main);
            color: var(--card);
            font-size: 12px;
            font-weight: 600;
            line-height: 20px;
            text-align: center
        }

        .ac {
            min-width: 132px;
            display: flex;
            justify-content: flex-end
        }

        .st.big {
            gap: 12px;
            background: var(--bg);
            border-radius: 50px;
            padding: 4px
        }

        .st.big button {
            width: 34px;
            height: 34px;
            background: var(--btn);
            color: var(--btn-t);
            box-shadow: none;
            font-size: 20px
        }

        .st.big span {
            min-width: 24px;
            font-size: 16px
        }

        @media(max-width:768px) {
            .ac {
                width: 100%
            }

            .ac .btn {
                width: 100%
            }

            .st.big {
                width: 100%;
                justify-content: space-between
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        /* Espelha o data.js: todo texto vem daqui */
        const D = {
            empresa: {nome: "WV Distrubuidora", cnpj: "00.000.000/0001-00", wa: "https://wa.me/32991507977"},
            cats: [
                {id: "maq", nome: "Máquinas e ferramentas", d: "Furadeiras, serras e esmerilhadeiras", g: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'},
                {id: "pan", nome: "Panelas", d: "Inox, antiaderente e de pressão", g: '<path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4zM2 10h20M9 6h6"/>'},
                {id: "faq", nome: "Faqueiros", d: "Conjuntos de 12 e 17 peças", g: '<path d="M7 3v7M5 3v5a2 2 0 0 0 4 0V3M7 10v11M17 3c-2 2-2 6 0 8v10"/>'},
                {id: "tal", nome: "Talheres", d: "Conjuntos de 48 e 84 peças", g: '<path d="M7 3v7M5 3v5a2 2 0 0 0 4 0V3M7 10v11M17 3c-2 2-2 6 0 8v10"/>'},
            ],
            itens: [
                {c: "maq", n: "Kit Martelete com Furadeira", d: "Mandril de 13 mm, com maleta e jogo de brocas.", p: "510,00"},
                {c: "maq", n: "Kit Furadeira + Impacto", d: "850W, para corte e desbaste de metal.", p: "490,00"},
                {c: "maq", n: "Kit Lixadeira + Impacto", d: "1.500W, guia paralela e disco incluso.", p: "500,00"},
                {c: "maq", n: "Impacto Pequena", d: "1.500W, guia paralela e disco incluso.", p: "340,00"},
                {c: "maq", n: "Catraca", d: "1.500W, guia paralela e disco incluso.", p: "340,00"},
                {c: "maq", n: "Motosserra", d: "1.500W, guia paralela e disco incluso.", p: "430,00"},
                {c: "maq", n: "Roçadeira", d: "1.500W, guia paralela e disco incluso.", p: "430,00"},
                {c: "maq", n: "Impacto Comum", d: "1.500W, guia paralela e disco incluso.", p: "300,00"},
                {c: "maq", n: "Impacto Pequena Makita", d: "1.500W, guia paralela e disco incluso.", p: "340,00"},
                {c: "maq", n: "Impacto com Adaptador", d: "1.500W, guia paralela e disco incluso.", p: "460,00"},
                {c: "maq", n: "Impacto 3/4", d: "1.500W, guia paralela e disco incluso.", p: "560,00"},
                {c: "pan", n: "Jogo de Panelas Donna 22 Peças", d: "Fundo triplo, serve em fogão e indução.", p: "510,00"},
                {c: "pan", n: "Jogo de Panelas Monaco 21 Peças", d: "Alumínio reforçado, três válvulas de segurança.", p: "430,00"},
                {c: "pan", n: "Jogo de Panelas Monaco 20 Peças", d: "Alumínio reforçado, três válvulas de segurança.", p: "430,00"},
                {c: "faq", n: "Faqueiro Monaco 12 Peças", d: "Garfos, facas, colheres e talheres de sobremesa.", p: "45,00"},
                {c: "faq", n: "Faqueiro Monaco 17 Peças", d: "Conjunto para seis pessoas, com estojo.", p: "55,00"},
                {c: "tal", n: "Jogo de Talheres Monaco 48 Peças", d: "Conjunto para seis pessoas, com estojo.", p: "260,00"},
                {c: "tal", n: "Jogo de Talheres Monaco 84 Peças", d: "Conjunto para seis pessoas, com estojo.", p: "360,00"},
            ],
            hero: [
                {t: "Tudo para a obra e para a cozinha, em um só galpão", s: "Máquinas, ferramentas, panelas e faqueiros com estoque no local. Veja, compare e leve no mesmo dia."},
                {t: "Ferramentas, panelas e faqueiros direto do galpão", s: "Escolha um departamento e peça o preço pelo WhatsApp. Atendemos em loja e por entrega."},
                {t: "Compre por unidade ou monte seu pedido no atacado", s: "Preço de galpão para quem compra para casa, obra ou revenda. Peça o orçamento em poucos minutos."}],
            ben: [["Retirada no galpão", "Pedido separado e pronto no balcão."], ["Entrega na cidade", "Combine o frete pelo WhatsApp."], ["Atacado e varejo", "Descontos para quantidade."]],
            sobre: {
                t: "Um galpão que começou pequeno", s: "Começamos vendendo ferramentas para quem trabalha com obra. Hoje reunimos também utilidades para a casa, sempre com produto à mostra e estoque no local.",
                det: "Trabalhamos com marcas conhecidas e com linhas de custo menor, e explicamos as diferenças antes da compra. Todo produto elétrico sai testado, com nota fiscal e garantia."
            },
            hor: [["SEG-SEX:", "08:00 - 18:00"], ["SÁBADO:", "08:00 - 13:00"], ["DOMINGO:", "FECHADO"]],
            end: "Rua Paulo Augusto Tucci, 64, Jardim Izolina, Ibitinga, SP - 14943440",
            redes: ["WhatsApp", "E-mail"]
        };
        D.itens.forEach((i, k) => i.id = k);
        const cat = id => D.cats.find(c => c.id === id);
        const ic = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${cat(id).g}</svg>`;
        const wa = t => `${D.empresa.wa}?text=${encodeURIComponent(t)}`;
        const header = () => `<header class="hd"><span class="logo">${D.empresa.nome}</span><nav><a href="#inicio">Início</a><a href="#catalogo">Catálogo</a><a href="#sobre">Sobre nós</a><a href="#contatos">Contatos</a></nav><button class="cbtn" id="cartBtn" aria-label="Abrir orçamento"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 7H6.2M9 20h.01M17 20h.01"/></svg><span id="cnt" hidden>0</span></button></header>`;
        const sobre = () => `<section id="sobre" class="pn"><div class="tt"><h1>${D.sobre.t}</h1></div><div class="sob"><div class="im"><div class="ph">${ic("maq")}</div></div><div class="tx"><h3>Produto à mostra, estoque no local</h3><h2>${D.sobre.s}</h2><p>${D.sobre.det}</p></div></div></section>`;
        const contatos = () => `<section id="contatos"><div class="tt"><h1>Contatos</h1><h2>Fale com a gente ou passe no galpão.</h2></div><div class="ct"><div class="bx"><label>Pedidos</label><a href="${D.empresa.wa}">WhatsApp</a></div><div class="bx"><label>Localização</label><a href="#">${D.end || D.end}</a></div><div class="bx"><label>Redes sociais</label>${D.redes.map(r => `<a href="#">${r}</a>`).join("")}</div><div class="bx"><label>Funcionamento</label>${D.hor.map(h => `<div class="h"><p>${h[0]}</p><p>${h[1]}</p></div>`).join("")}</div></div></section>`;
        const footer = () => `<footer><h2 style="font-size:13px">${D.empresa.nome} - Todos os direitos reservados - CNPJ: ${D.empresa.cnpj}</h2></footer>`;
        const card = (i, preco) => `<article class="card"><div class="ph">${ic(i.c)}</div><h3>${i.n}</h3><p>${i.d}</p>${preco ? `<p class="pr">R$ ${i.p}</p>` : ""}<a class="btn" href="${wa("Quero saber sobre: " + i.n)}">${preco ? "Peça já" : "Consultar preço"}</a></article>`;
        const btns = () => `<div class="bt"><a class="btn o" href="#catalogo">Ver catálogo</a><a class="btn" href="${D.empresa.wa}">Pedir orçamento</a></div>`;

        function v0() {
            return header() + `<section id="inicio" class="pn hero"><div class="l"><h1>${D.hero[0].t}</h1><h2>${D.hero[0].s}</h2>${btns()}</div><div class="r"><div class="dep" style="grid-template-columns:1fr 1fr;max-width:420px">${D.cats.map(c => `<a href="#catalogo" data-f="${c.id}"><span class="ic">${ic(c.id)}</span><span>${c.nome}</span></a>`).join("")}</div></div></section>
<section id="catalogo"><div class="tt"><h1>Nosso Catálogo</h1><h2>Filtre por departamento e chame no WhatsApp para confirmar estoque e preço.</h2></div><div class="chips" id="chips"></div><div class="grid" id="g0"></div></section>`+ sobre() + contatos() + footer();
        }
        function v0init() {
            const chips = document.getElementById("chips"), g = document.getElementById("g0"); let f = "";
            const draw = () => {
                chips.innerHTML = [["", "Todos"], ...D.cats.map(c => [c.id, c.nome])].map(([id, n]) => `<button data-c="${id}" aria-pressed="${f === id}">${n}</button>`).join("");
                g.innerHTML = D.itens.filter(i => !f || i.c === f).map(i => card(i, true)).join("");
            };
            chips.onclick = e => {const b = e.target.closest("button"); if (b) {f = b.dataset.c; draw()} };
            document.querySelectorAll("[data-f]").forEach(a => a.onclick = () => {f = a.dataset.f; draw()}); draw();
        }

        function v1() {
            return header() + `<section id="inicio" class="hero" style="flex-direction:column;text-align:center;min-height:auto;padding-bottom:20px"><h1 style="max-width:820px">${D.hero[1].t}</h1><h2 style="max-width:620px">${D.hero[1].s}</h2><div class="dep">${D.cats.map(c => `<a href="#cat-${c.id}"><span class="ic">${ic(c.id)}</span><b>${c.nome}</b><span>${c.d}</span></a>`).join("")}</div></section>
<section id="catalogo" class="pn"><div class="tt"><h1>Catálogo por departamento</h1><h2>Sem preço na página: o valor é confirmado no WhatsApp, sempre atualizado.</h2></div><div class="list">${D.cats.map(c => `<h3 class="g" id="cat-${c.id}">${c.nome}</h3><div class="grid">${D.itens.filter(i => i.c === c.id).map(i => card(i, false)).join("") || `<p>Chame no WhatsApp para ver as opções.</p>`}</div>`).join("")}</div></section>` + sobre().replace('class="pn"', '') + contatos() + footer();
        }

        function v2() {
            return header() + `<section id="inicio" class="pn hero"><div class="l"><h1>${D.hero[2].t}</h1><h2>${D.hero[2].s}</h2><div class="bt"><a class="btn o" href="#catalogo">Ver catálogo</a><button class="btn" data-open>Ver meu orçamento</button></div></div></section>
<section><div class="ben">${D.ben.map(b => `<div><b>${b[0]}</b><span>${b[1]}</span></div>`).join("")}</div></section>
<section id="catalogo" class="pn"><div class="tt"><h1>Lista de produtos</h1><h2>Adicione os produtos e envie o orçamento pelo WhatsApp. Para quantidade, peça preço de atacado.</h2></div><div class="list">${D.cats.map(c => {const it = D.itens.filter(i => i.c === c.id); return it.length ? `<h3 class="g">${c.nome}</h3>` + it.map(i => `<div class="row"><span class="ic">${ic(i.c)}</span><div class="tx"><h3>${i.n}</h3><p>${i.d}</p></div><span class="pr">R$ ${i.p}</span><div class="ac" data-id="${i.id}"></div></div>`).join("") : ""}).join("")}</div></section>` + sobre().replace('class="pn"', '') + contatos() + footer();
        }

        document.getElementById("app").innerHTML = v2() + '<p class="note">Nome, número do WhatsApp, endereço, CNPJ, produtos e preços são exemplos. Tudo sai do data.js.</p>';

        document.body.insertAdjacentHTML("beforeend", '<div class="ov" id="ov"></div><aside id="cart" aria-label="Meu orçamento" aria-hidden="true"><div class="ch"><h2>Meu orçamento</h2><button class="x" data-close aria-label="Fechar">×</button></div><div id="ci"></div><div class="cf"><div class="t"><span>Total estimado</span><span id="tot"></span></div><button class="btn" id="send">Fazer orçamento no WhatsApp</button><button id="clear">Limpar orçamento</button><small>O valor final e a disponibilidade são confirmados pelo vendedor.</small></div></aside>');
        const $ = id => document.getElementById(id);
        const fmt = n => n.toLocaleString("pt-BR", {style: "currency", currency: "BRL"});
        const num = p => Number(p.replace(/\./g, "").replace(",", "."));
        let cart = {}; try {cart = JSON.parse(localStorage.getItem("cart") || "{}")} catch (e) { }
        const ids = () => Object.keys(cart).filter(k => D.itens[k] && cart[k] > 0);
        const total = () => ids().reduce((a, k) => a + cart[k] * num(D.itens[k].p), 0);
        function render() {
            const l = ids(), n = l.reduce((a, k) => a + cart[k], 0); $("cnt").textContent = n; $("cnt").hidden = !n; $("cartBtn").setAttribute("aria-label", n ? `Abrir orçamento, ${n} ${n > 1 ? "itens" : "item"}` : "Abrir orçamento");
            document.querySelectorAll(".ac").forEach(a => {const k = a.dataset.id, q = cart[k] || 0; a.innerHTML = q ? `<div class="st big"><button data-dec="${k}" aria-label="Diminuir">−</button><span>${q}</span><button data-inc="${k}" aria-label="Aumentar">+</button></div>` : `<button class="btn" data-add="${k}">Adicionar</button>`});
            $("ci").innerHTML = l.length ? l.map(k => {const i = D.itens[k]; return `<div class="ci"><div class="tx"><h3>${i.n}</h3><p>R$ ${i.p} cada</p></div><div class="st"><button data-dec="${k}" aria-label="Diminuir">−</button><span>${cart[k]}</span><button data-inc="${k}" aria-label="Aumentar">+</button></div><button class="rm" data-rm="${k}" aria-label="Remover ${i.n}">×</button></div>`}).join("") : '<p class="em">Seu orçamento está vazio. Toque em "Adicionar" nos produtos que você quer.</p>';
            $("tot").textContent = fmt(total()); $("send").disabled = !l.length; $("clear").hidden = !l.length;
            try {localStorage.setItem("cart", JSON.stringify(cart))} catch (e) { }
        }
        const open = o => {$("cart").classList.toggle("on", o); $("ov").classList.toggle("on", o); $("cart").setAttribute("aria-hidden", !o); if (o) $("cart").querySelector(".x").focus()};
        const message = () => `Olá, ${D.empresa.nome}! Gostaria de um orçamento dos itens abaixo:\n\n${ids().map(k => `• ${cart[k]}x ${D.itens[k].n} (R$ ${D.itens[k].p} un.)`).join("\n")}\n\nTotal estimado: ${fmt(total())}\n\nPode confirmar a disponibilidade e o valor final?`;
        document.addEventListener("click", e => {
            const t = e.target.closest("[data-add],[data-inc],[data-dec],[data-rm],[data-open],[data-close],#cartBtn,#ov,#send,#clear"); if (!t) return;
            const d = t.dataset;
            const box = t.closest(".ac,#ci");
            if ("add" in d) cart[d.add] = 1;
            else if ("inc" in d) cart[d.inc] = (cart[d.inc] || 0) + 1;
            else if ("dec" in d) {cart[d.dec]--; if (cart[d.dec] < 1) delete cart[d.dec]}
            else if ("rm" in d) delete cart[d.rm];
            else if (t.id === "clear") cart = {};
            else if (t.id === "send") {window.open(wa(message()), "_blank", "noopener"); return }
            else {open("open" in d || t.id === "cartBtn"); return }
            render();
            if (box) {const k = d.add ?? d.inc ?? d.dec; const el = box.querySelector("add" in d || "inc" in d ? `[data-inc="${k}"]` : `[data-dec="${k}"],[data-add="${k}"]`); if (el) el.focus()}
        });
        document.addEventListener("keydown", e => {if (e.key === "Escape") open(false)});
        render();
    </script>
</body>

</html>
